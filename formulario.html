<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Añadir libro · La Estantería</title>
    <link rel="icon" type="image/svg+xml" href="assets/media/logo/favicon.svg">
    <link rel="stylesheet" href="assets/css/styles.css">
    <script src="assets/js/tema.js"></script>
    <script type="module" src="assets/js/app.js"></script>
</head>

<body>
    <div class="cabecera-fija">
        <header class="cabecera">
            <div class="marca">
                <span class="marca-icono" aria-hidden="true"></span>
                <span>La Estantería</span>
            </div>
            <div class="cabecera-acciones">
                <label class="buscador">
                    <span class="sr-only">Buscar</span>
                    <input type="search" id="buscador-catalogo" placeholder="Buscar...">
                    <span aria-hidden="true">⌕</span>
                </label>
                <button type="button" class="btn-tema" aria-pressed="false">
                    <span class="punto" aria-hidden="true"></span>
                    <span class="texto">Tema oscuro</span>
                </button>
                <a href="login.html" class="btn-login" aria-label="Iniciar sesión o registrarse">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span>Login</span>
                </a>
            </div>
        </header>
        <nav class="navbar" aria-label="Navegación principal">
            <a href="index.html">Inicio</a>
            <a href="index.html#catalogo">Catálogo</a>
            <a href="index.html#resenas-destacadas">Reseñas recientes</a>
            <a href="formulario.html" class="activo" aria-current="page">Añadir libro</a>
        </nav>
    </div>

    <main class="seccion pagina-form">
        <div class="tarjeta-form">
            <div class="cabecera-form">
                <p class="sobretitulo">Nuevo libro</p>
                <h1>Formulario</h1>
                <p>Completa los datos para añadir una nueva lectura al catálogo.</p>
            </div>

            <form id="form-libro" action="#" method="post" enctype="multipart/form-data" data-validar>
                <div class="form-rejilla">
                    <label class="campo">
                        <span>Título <b>*</b></span>
                        <input type="text" name="titulo" required placeholder="Ej. La última carta">
                    </label>
                    <label class="campo">
                        <span>Autor <b>*</b></span>
                        <input type="text" name="autor" required placeholder="Nombre del autor">
                    </label>
                    <label class="campo">
                        <span>Género <b>*</b></span>
                        <select name="genero" required>
                            <option value="" selected disabled>Selecciona un género</option>
                            <option value="Ciencia ficción">Ciencia ficción</option>
                            <option value="Fantasía">Fantasía</option>
                            <option value="Clásico">Clásico</option>
                            <option value="Terror">Terror</option>
                            <option value="Misterio">Misterio</option>
                            <option value="Romance">Romance</option>
                            <option value="Aventura">Aventura</option>
                            <option value="Poesía">Poesía</option>
                        </select>
                    </label>
                    <label class="campo">
                        <span>Año <b>*</b></span>
                        <input type="number" name="anio_publicacion" min="1000" max="2026" required placeholder="2026">
                    </label>
                    <label class="campo campo-ancho">
                        <span>Sinopsis <b>*</b></span>
                        <textarea name="sinopsis" rows="5" required
                            placeholder="Escribe una breve sinopsis..."></textarea>
                    </label>
                    <label class="campo campo-ancho">
                        <span>Estado de lectura <b>*</b></span>
                        <select name="estado" required>
                            <option value="" selected disabled>Selecciona un estado</option>
                            <option value="pendiente">Pendiente</option>
                            <option value="leyendo">Leyendo</option>
                            <option value="leido">Leído</option>
                        </select>
                    </label>
                </div>

                <div class="form-extras">
                    <label class="caja-subida">
                        <span class="mas" aria-hidden="true">+</span>
                        <span>Añadir imagen de portada</span>
                        <small>Obligatorio (WEBP, JPG o PNG)</small>
                        <input type="file" name="portada" accept="image/webp,image/jpeg,image/png" class="sr-only"
                            required>
                    </label>
                </div>

                <div class="form-acciones">
                    <button type="submit" class="btn btn-primario">Guardar</button>
                    <a href="index.html" class="btn btn-secundario">Cancelar</a>
                </div>
            </form>
        </div>
    </main>

    <footer class="pie">
        <p>© 2025 La Estantería. Club de lectura.</p>
        <nav aria-label="Enlaces del pie">
            <a href="#privacidad">Privacidad</a>
            <a href="#contacto">Contacto</a>
            <a href="#ayuda">Ayuda</a>
        </nav>
    </footer>
</body>

</html>
